name: Deploy to OpenShip

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-openship-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Trigger OpenShip deployment
        env:
          OPENSHIP_DEPLOY_WEBHOOK_URL: ${{ secrets.OPENSHIP_DEPLOY_WEBHOOK_URL }}
          OPENSHIP_DEPLOY_WEBHOOK_TOKEN: ${{ secrets.OPENSHIP_DEPLOY_WEBHOOK_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${OPENSHIP_DEPLOY_WEBHOOK_URL}"
          test -n "${OPENSHIP_DEPLOY_WEBHOOK_TOKEN}"
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer ${OPENSHIP_DEPLOY_WEBHOOK_TOKEN}" \
            "${OPENSHIP_DEPLOY_WEBHOOK_URL}"
