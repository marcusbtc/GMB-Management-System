name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pip-audit
      - name: Compile check
        run: python -m py_compile app.py auth.py data_fetcher.py drive_helper.py
      - name: Lint
        run: ruff check src tests app.py auth.py
      - name: Tests
        run: pytest
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

  deployment-readiness:
    runs-on: ubuntu-latest
    needs: quality
    env:
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      GOOGLE_REDIRECT_URI: https://example.invalid/oauth/callback
    steps:
      - uses: actions/checkout@v5
      - run: sh scripts/check-deploy-readiness.sh
      - run: docker compose -f docker-compose.prod.yml config --quiet
      - run: docker build -t gmb-management-system:${{ github.sha }} .
